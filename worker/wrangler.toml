name = "pluvia-alerts"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Toutes les 10 minutes (heure UTC, sans importance ici).
[triggers]
crons = ["*/10 * * * *"]

# Stockage des abonnements. L'identifiant est créé à l'étape de déploiement :
#   npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "REMPLACER_PAR_L_ID_DU_KV"

[vars]
# Sites autorisés à appeler l'API (l'application en ligne, et l'aperçu local).
ALLOWED_ORIGINS = "https://lexahrro.github.io,http://localhost:4173,http://localhost:5173"
# Adresse de contact transmise aux services de push (URL du projet, pas d'e-mail).
VAPID_SUBJECT = "https://github.com/lexahrro/pluvia"
# Clé publique : générée par scripts/generate-vapid.mjs
VAPID_PUBLIC_KEY = "BHBX446bNyAwvS1lNsKCeO6RNKF8t_kxjHUtq9TsGVehbYk4coEzA8QV1ExSwDwyoO_XPUeSMuDa6cfLzJMLH1M"
